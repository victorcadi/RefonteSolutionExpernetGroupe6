# Services de développement : base MySQL et capture des e-mails (Mailpit).
# Les identifiants ci-dessous sont des valeurs de développement par défaut,
# à surcharger via un fichier .env.local ou des variables d'environnement.
services:
###> doctrine/doctrine-bundle ###
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-db_refonte_expernet}
      MYSQL_USER: ${MYSQL_USER:-usr_expernet}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_dev_password}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - database_data:/var/lib/mysql:rw
###< doctrine/doctrine-bundle ###

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
