# Développement : code monté, utilisateur de la machine hôte, ports exposés.
# Application : http://localhost:8000 – e-mails : http://localhost:8025
# Ports modifiables si déjà pris : APP_PORT, DATABASE_PORT, MAILPIT_PORT, MAILPIT_SMTP_PORT.
services:
  app:
    build:
      target: dev
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/app
    # SELinux (Fedora…) : autorise l'écriture dans le code monté sans réétiqueter les fichiers
    security_opt:
      - label=disable
    ports:
      - "${APP_PORT:-8000}:8080"
    # Le premier lancement installe les dépendances Composer : délai de démarrage plus long
    healthcheck:
      start_period: 5m
    environment:
      APP_ENV: dev
      # Charge les données de démonstration si la base est vide
      CHARGER_DONNEES_DEMO: 1
      # Mailpit du projet ; MAILER_DSN_DEV permet d'en viser un autre (ex. smtp://host.docker.internal:1025)
      MAILER_DSN: ${MAILER_DSN_DEV:-smtp://mailer:1025}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build:
      target: dev
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/app
    # SELinux (Fedora…) : autorise l'écriture dans le code monté sans réétiqueter les fichiers
    security_opt:
      - label=disable
    environment:
      APP_ENV: dev
      # Mailpit du projet ; MAILER_DSN_DEV permet d'en viser un autre (ex. smtp://host.docker.internal:1025)
      MAILER_DSN: ${MAILER_DSN_DEV:-smtp://mailer:1025}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Attend que l'application ait installé les dépendances et préparé la base
    depends_on:
      app:
        condition: service_healthy

###> doctrine/doctrine-bundle ###
  database:
    ports:
      - "${DATABASE_PORT:-3307}:3306"
    # Crée la base des tests automatiques au premier lancement
    volumes:
      - ./docker/mysql:/docker-entrypoint-initdb.d:ro
    security_opt:
      - label=disable
###< doctrine/doctrine-bundle ###

###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###
