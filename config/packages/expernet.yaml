# Contenus institutionnels d'Expernet, centralisés ici plutôt qu'en dur dans les templates.
# Sources : site expernet.re (pied de page et page d'accueil, relevés en octobre 2026).
# Une valeur à null masque l'élément correspondant sur le site.
parameters:
    expernet.demo: '%env(bool:APP_DEMO)%'

    # Adresses utilisées par les formulaires publics (voir .env).
    expernet.email_equipe: '%env(EXPERNET_EMAIL_EQUIPE)%'
    expernet.email_expediteur: '%env(EXPERNET_EMAIL_EXPEDITEUR)%'

    expernet.organisme:
        nom: 'Expernet'
        accroche: 'Centre de formation en Informatique & Marketing Digital à La Réunion et à Mayotte'
        slogan: 'Inspirez le Digital de demain !'
        depuis: 2002
        telephone: '02 62 21 90 45'
        telephone_international: '+262262219045'
        email: 'formation@expernet.re'
        certification_qualiopi: 'La certification qualité a été délivrée au titre de la catégorie d’actions suivantes : actions de formation, actions de formation par apprentissage.'
        # Documents officiels : déposer le PDF dans public/documents/ puis renseigner son nom.
        certificat_qualiopi_pdf: 'certificat-qualiopi.pdf'
        livret_accueil_pdf: 'livret-accueil-formation-continue.pdf'
        referente_handicap:
            nom: 'Murielle CHAMAND'
            telephone: '02 62 21 90 45'
            email: 'm.chamand@expernet.re'
        # Durées de conservation affichées sous les formulaires (RGPD, art. 13).
        # Valeurs recommandées par la CNIL, à faire valider par Expernet.
        conservation_donnees:
            demandes: '3 ans à compter de notre dernier échange'
            candidatures: '2 ans après notre dernier échange, sans suite de votre part'
            espace_formation: 'pendant la formation, puis le temps nécessaire aux contrôles des financeurs et des certificateurs'
        reseaux_sociaux:
            # Comptes officiels liés depuis le pied de page d'expernet.re (null = icône masquée).
            facebook: 'https://www.facebook.com/EXPERNETFORMATION'
            linkedin: 'https://www.linkedin.com/in/expernet-centre-de-formation/'
        # Mentions légales. Sources : page « Mentions légales » d'expernet.re et certificat
        # Qualiopi n° 23FOR01923.1 (octobre 2026). Une valeur à null n'est pas affichée.
        mentions_legales:
            raison_sociale: 'EXPERNET'
            forme_juridique: null
            capital: null
            siege: '38, rue Claude Chappe, ZAC 2000, 97420 Le Port'
            siren: '442 764 684'
            siret: '442 764 684 00027'
            rcs: null
            tva_intracommunautaire: null
            declaration_activite: '98 97 01198 97'
            declaration_activite_note: 'Cet enregistrement ne vaut pas agrément de l’État.'
            certificat_qualiopi: { numero: '23FOR01923.1', organisme: 'QUALITIA Certification', valide_jusqu_au: '2027-06-22' }
            responsable_publication: null
            # Hébergeur du site actuel : à mettre à jour lors du déploiement de la refonte.
            hebergeur: { nom: 'Hodi', adresse: '14 rue Pasteur, 97400 Saint-Denis, La Réunion' }

    # Chiffres clés affichés sur la page d'accueil (expernet.re).
    expernet.chiffres_cles:
        - { valeur: '3 350', libelle: 'personnes formées en 2024 et 2025' }
        - { valeur: '1 502', libelle: 'sessions de formation en 2024 et 2025' }
        - { valeur: '86 %', libelle: 'de taux de satisfaction' }
        - { valeur: '876', libelle: 'clients nous font confiance' }

    expernet.parcours:
        - { titre: 'Intra-entreprise', texte: 'La formation intra-entreprise est destinée à un groupe spécifique de participants au sein de la même entreprise.', icone: 'people-fill' }
        - { titre: 'Inter-entreprise', texte: 'La formation inter-entreprise s’adresse à un public varié issu de différentes entreprises.', icone: 'building' }
        - { titre: 'Sur-mesure', texte: 'La formation sur mesure se veut intensive et ciblée sur une courte période.', icone: 'clipboard-check' }
