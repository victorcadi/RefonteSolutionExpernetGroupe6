security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateur
                property: email

    # Un administrateur dispose aussi des droits d'un formateur.
    role_hierarchy:
        ROLE_ADMIN: [ROLE_FORMATEUR]

    firewalls:
        dev:
            # Outils de développement et assets statiques, hors sécurité
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\VerificateurCompte
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_ent_accueil
            # 5 essais de mot de passe par quart d'heure (par identifiant et par adresse IP)
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: app_logout
                target: app_accueil
                enable_csrf: true
            # Second facteur (TOTP) pour les comptes qui l'ont activé
            two_factor:
                auth_form_path: 2fa_login
                check_path: 2fa_login_check
                default_target_path: app_ent_accueil
                enable_csrf: true

    # Seule la première règle correspondante s'applique.
    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/2fa, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/ent/admin, roles: ROLE_ADMIN }
        - { path: ^/ent/formateur, roles: ROLE_FORMATEUR }
        - { path: ^/ent/etudiant, roles: ROLE_ETUDIANT }
        - { path: ^/ent, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
