twig:
    file_name_pattern: '*.twig'
    date:
        timezone: '%env(APP_TIMEZONE)%'
        format: 'd/m/Y H:i'
    number_format:
        decimals: 0
        decimal_point: ','
        thousands_separator: ' '
    globals:
        expernet: '%expernet.organisme%'
        expernet_demo: '%expernet.demo%'

when@test:
    twig:
        strict_variables: true
